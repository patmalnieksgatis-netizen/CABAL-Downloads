name: Diamond V20 native rank-up integration
on:
  push:
    branches: [feature/diamond-native-registration-v19-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native registry SQL-result and asynchronous completion fixtures
        run: |
          set -euo pipefail
          for mode in default clone; do
            flags=()
            if [ "$mode" = clone ]; then flags=(-DDIAMOND_ENABLE_0BDA_CLONE_TRIAL); fi
            for test in test_native_rankup_v20 test_native_rankup_completion; do
              g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic "${flags[@]}" \
                diamond-insignia/worldsvr-ingress/$test.cpp \
                diamond-insignia/worldsvr-ingress/DiamondNativeRankUpCompletion.cpp \
                diamond-insignia/native/world-save-barrier/DiamondWorldSaveBarrier.cpp \
                diamond-insignia/native/grade2-ingress/Diamond0BDASaveReplyGate.cpp \
                -o /tmp/$test
              /tmp/$test
            done
          done
      - name: Check actual Server01 bridge and authenticated ingress sources
        run: |
          g++ -std=c++17 -fsyntax-only diamond-insignia/native/real-gamedata-transaction/Diamond0BDARealServer01Bridge.cpp diamond-insignia/native/grade2-ingress/Diamond0BDAAuthenticatedIngress.cpp
