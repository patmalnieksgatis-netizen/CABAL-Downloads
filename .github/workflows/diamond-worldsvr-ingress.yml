name: Diamond v291 passive WorldSvr ingress safety
on:
  push:
    branches:
      - feature/diamond-insignia-v291-20261121
    paths:
      - diamond-insignia/worldsvr-ingress/**
      - diamond-insignia/native/diamond_merit_world_entry.cpp
      - diamond-insignia/native/diamond_merit_world_entry.h
      - diamond-insignia/native/diamond_abi.cpp
      - diamond-insignia/native/diamond_abi.h
      - diamond-insignia/native/diamond_world_bridge.cpp
      - diamond-insignia/native/diamond_world_bridge.h
      - .github/workflows/diamond-worldsvr-ingress.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test packet gate, with default NO-OP and explicit observation
        run: |
          set -eux
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            diamond-insignia/worldsvr-ingress/tests/test_diamond_ingress.cpp \
            -o /tmp/diamond_passive_ingress_test
          /tmp/diamond_passive_ingress_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            diamond-insignia/worldsvr-ingress/tests/test_diamond_ingress_enabled.cpp \
            -o /tmp/diamond_passive_ingress_enabled
          CABAL_DIAMOND_PASSIVE_OBSERVE=1 /tmp/diamond_passive_ingress_enabled
      - name: Verify default plugin binding cannot write and opt-in synthetic WorldBridge
        run: |
          set -eux
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic             -Idiamond-insignia/native             diamond-insignia/worldsvr-ingress/tests/test_diamond_bound_default.cpp             -o /tmp/diamond_bound_default_test
          /tmp/diamond_bound_default_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic             -DDIAMOND_ENABLE_SHADOW_TRIAL -Idiamond-insignia/native             diamond-insignia/worldsvr-ingress/tests/test_diamond_bound_bridge.cpp             diamond-insignia/native/diamond_merit_world_entry.cpp             diamond-insignia/native/diamond_abi.cpp             diamond-insignia/native/diamond_world_bridge.cpp             -o /tmp/diamond_bound_shadow_test
          /tmp/diamond_bound_shadow_test
      - name: Exercise dynamic loader and ABI-v2 synthetic ingress in a shared object
        run: |
          set -eux
          mkdir -p /tmp/diamond-dlopen-ci
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            diamond-insignia/native/diamond_abi.cpp \
            diamond-insignia/native/diamond_world_bridge.cpp \
            -o /tmp/diamond-dlopen-ci/libDiamondNative.so
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            -DDIAMOND_ENABLE_SHADOW_TRIAL -Idiamond-insignia/native \
            diamond-insignia/worldsvr-ingress/tests/OfflineBoundIngressShim.cpp \
            diamond-insignia/native/diamond_merit_world_entry.cpp \
            -L/tmp/diamond-dlopen-ci -lDiamondNative \
            '-Wl,-rpath,$ORIGIN' -Wl,-z,defs \
            -o /tmp/diamond-dlopen-ci/libDiamondSyntheticIngress.so
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -DDIAMOND_ENABLE_SHADOW_TRIAL -Idiamond-insignia/native \
            diamond-insignia/worldsvr-ingress/tests/test_diamond_clone_dlopen.cpp \
            -L/tmp/diamond-dlopen-ci -lDiamondNative -ldl \
            '-Wl,-rpath,/tmp/diamond-dlopen-ci' \
            -o /tmp/diamond-dlopen-ci/diamond_clone_dlopen_smoke
          LD_LIBRARY_PATH=/tmp/diamond-dlopen-ci \
            /tmp/diamond-dlopen-ci/diamond_clone_dlopen_smoke \
            /tmp/diamond-dlopen-ci/libDiamondSyntheticIngress.so
          echo 'CI_SHARED_OBJECT_IS_SYNTHETIC_NOT_ARCHIVED_WORLDSVR=YES'
      - name: Verify patcher is syntactically valid and refuses unknown source
        run: |
          set -eux
          python3 -m py_compile diamond-insignia/worldsvr-ingress/Apply-DiamondIngressClone.py
          python3 -m py_compile diamond-insignia/worldsvr-ingress/Apply-DiamondBoundClone.py
          python3 -m py_compile diamond-insignia/worldsvr-ingress/Verify-DiamondWorldSvrSourceClone.py
          python3 -m py_compile diamond-insignia/worldsvr-ingress/Link-DiamondWorldSvrCloneLab.py
          if python3 diamond-insignia/worldsvr-ingress/Link-DiamondWorldSvrCloneLab.py \
                --clone-source . --native-lib . --merit-cpp . \
                --output /tmp/diamond_never_lib.so; then
            echo 'ERROR: linker preflight accepted unauthorized output filename'; exit 1
          fi
          test ! -e /tmp/diamond_never_lib.so
          python3 -m unittest discover -s diamond-insignia/worldsvr-ingress/tests -p 'test_bound_clone_patcher.py' -v
          if python3 diamond-insignia/worldsvr-ingress/Apply-DiamondIngressClone.py \
                --source . --output /tmp/diamond_unsafe_source; then
            echo "ERROR: patcher accepted unverified source"
            exit 1
          fi
          test ! -e /tmp/diamond_unsafe_source
          if python3 diamond-insignia/worldsvr-ingress/Apply-DiamondBoundClone.py --source . --output /tmp/diamond_unsafe_bound_source; then
            echo 'ERROR: bound patcher accepted unverified original source'
            exit 1
          fi
          test ! -e /tmp/diamond_unsafe_bound_source
          if python3 diamond-insignia/worldsvr-ingress/Verify-DiamondWorldSvrSourceClone.py --source . --output /tmp/diamond_unsafe_build_clone; then
            echo 'ERROR: clone build accepted unverified WorldSvr source'; exit 1
          fi
          test ! -e /tmp/diamond_unsafe_build_clone
      - name: No live hook, package or database deployment
        run: echo "READ_ONLY_INGRESS=PASS;ACTUAL_WORLDSVR_GAMEPLAY_TEST=NOT_PERFORMED"
