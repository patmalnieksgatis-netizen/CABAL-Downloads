name: Diamond Merit x64 Deflate V11 Windows self-test
on:
  push:
    branches:
      - feature/diamond-insignia-v291-20261121
    paths:
      - diamond-insignia/client-codec/Inspect-Cabal291-MeritDeflate-V11.ps1
      - .github/workflows/diamond-merit-x64-deflate-v11.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-pdata-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V11 PE and PDATA extraction helpers without private game files
        shell: powershell
        run: |
          & .\diamond-insignia\client-codec\Inspect-Cabal291-MeritDeflate-V11.ps1 -SelfTestOnly
      - name: Confirm no game or server access
        shell: powershell
        run: |
          Write-Output 'Offline synthetic test only. CABAL EXE, ENC, VM, SQL and process memory not accessed.'
